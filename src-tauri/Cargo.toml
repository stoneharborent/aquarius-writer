[package]
name = "aquarius-writer"
version = "0.0.1"
description = "Aquarius Writer — local-first desktop writing studio"
edition = "2021"
rust-version = "1.77"

[lib]
name = "aquarius_writer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
