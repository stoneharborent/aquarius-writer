[package]
name = "aquarius-writer"
version = "0.5.2"
description = "Aquarius Writer — local-first desktop writing studio"
edition = "2021"
# Raised from 1.77 in Stage 5: rmcp (the official Rust MCP SDK) declares 1.88.
rust-version = "1.88"

[lib]
name = "aquarius_writer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Vault backend (Stage 2). Everything here is cross-platform: std, notify's
# portable backends (FSEvents on macOS, inotify on Linux), and pure-Rust
# time/uuid helpers. No Apple-only APIs.
notify = "6"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# MCP server (Stage 5). The official Rust SDK plus the smallest HTTP server that
# can host its tower service. Bound to 127.0.0.1 only — see src/mcp/mod.rs.
rmcp = { version = "3", features = ["server", "transport-streamable-http-server"] }
schemars = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["rt", "net", "sync"] }

# The AquariusOS self-updater (src/updater/). Three small, well-known crates:
#
#   ureq   a blocking HTTP client with rustls built in. No OpenSSL on the build
#          machine, no async runtime, and a plain `Read` for the download — which
#          is what makes a progress bar three lines of code.
#   sha2   to check a download against the release's SHA256SUMS.txt. This is the
#          gate that decides whether we are willing to run the file, so it is
#          not optional.
#   semver to compare version numbers correctly (0.10.0 comes after 0.9.0).
#
# All three are inert off AquariusOS — see src/updater/mod.rs.
ureq = { version = "3", default-features = false, features = ["rustls"] }
sha2 = "0.10"
semver = "1"

# The terminal pane (src/pty/). One crate, chosen because it is the same PTY
# layer WezTerm ships: it wraps forkpty/openpty on Unix and ConPTY on Windows
# behind one trait, so the pane is not a macOS-only feature the way SwiftTerm
# made it. Nothing else is pulled in — the terminal EMULATOR is xterm.js in the
# webview; this side only owns the pipe.
portable-pty = "0.9"

[features]
custom-protocol = ["tauri/custom-protocol"]

[target."cfg(unix)".dependencies]
libc = "0.2"
