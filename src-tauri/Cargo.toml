[package]
name = "aquarius-writer"
version = "0.0.1"
description = "Aquarius Writer — local-first desktop writing studio"
edition = "2021"
rust-version = "1.77"

[lib]
name = "aquarius_writer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Vault backend (Stage 2). Everything here is cross-platform: std, notify's
# portable backends (FSEvents on macOS, inotify on Linux), and pure-Rust
# time/uuid helpers. No Apple-only APIs.
notify = "6"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
