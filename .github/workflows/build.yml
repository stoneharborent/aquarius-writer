---
# ==============================================================================
# Build Aquarius Writer
# ==============================================================================
# Plain English: this file tells GitHub to build the app for you, on GitHub's
# computers, every time you push to `main` — and any time you press the button
# yourself on the Actions tab ("Run workflow").
#
# It does one more thing: when you push a *version tag* (`v0.1.0` and friends),
# it takes the two files it just built, renames them, checksums them, and
# publishes them as a public GitHub Release. See the "release" job at the bottom.
#
# It builds TWO things at once, on two different machines:
#
#   Linux  (ubuntu-22.04)  ->  Aquarius_Writer_..._amd64.AppImage
#                              The AquariusOS build. An AppImage is one single
#                              file: download it, mark it executable, run it.
#                              Nothing to install.
#
#   macOS  (macos-14)      ->  Aquarius Writer.app  (zipped)
#                              The Mac build, for testing on Royce's own
#                              machine.
#
# When a run finishes, both land at the bottom of that run's page under
# "Artifacts", as .zip downloads. They are kept for 14 days.
#
# WHY LINUX HAS TO BE BUILT HERE AND NOT ON THE MAC: a Tauri Linux build links
# against WebKitGTK and GTK, which are Linux libraries. They do not exist on
# macOS and do not cross-compile in any way we would trust. A Linux machine has
# to do it, and this is the free Linux machine.
#
# NOT WIRED UP YET, on purpose:
#   * Code signing / notarisation (macOS) and GPG signing (Linux).
#   * The Tauri updater and its signing key.
# Those are distribution decisions that need Royce's Apple Developer account
# and a signing key. The files a release publishes are therefore unsigned:
# macOS will need a right-click → Open on any Mac but Royce's, and Linux does
# not care. See the TODO comments at the end of the build job.
# ==============================================================================

name: Build Aquarius Writer

on:
  push:
    branches:
      - main
    # Documentation-only pushes don't need a 20-minute build.
    #
    # This does NOT block releases. GitHub's rule is "path filters are not
    # evaluated for pushes of tags" — a `v*` tag always builds, even when the
    # only thing that changed since the last one was CHANGELOG.md. Which is
    # exactly what you want, because writing the changelog is usually the last
    # commit before you tag.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
    # Version tags. Pushing one builds as usual and then publishes a release.
    tags:
      - 'v*'
  workflow_dispatch:

# Only one build per branch at a time. Pushing twice in a minute cancels the
# first run instead of paying for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      # One platform failing must not cancel the other. A broken Linux build
      # should still leave you a Mac build to test with, and vice versa.
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 rather than the newest Ubuntu on purpose. An AppImage
          # can only run on systems whose glibc is at least as new as the one it
          # was built against, so building on the OLDEST runner we support gives
          # the widest compatibility. AquariusOS is Fedora-based and far newer,
          # so this is headroom, not a requirement.
          # If GitHub ever retires the ubuntu-22.04 label, move to ubuntu-24.04:
          # the package list below is unchanged there (24.04 also ships
          # webkit2gtk-4.1), only the glibc floor rises.
          - os: ubuntu-22.04
            label: Linux (AppImage)
            bundles: appimage
            artifact: aquarius-writer-linux-appimage
            # Where tauri drops what it built.
            artifact-path: src-tauri/target/release/bundle/appimage/*.AppImage

          # macos-14 is Apple Silicon (arm64), which is what Royce's Mac is.
          # An Intel Mac would need a second entry with macos-13.
          # The path is the *.zip, not the *.app, because a .app is a folder —
          # see the "Zip the Mac app" step below.
          - os: macos-14
            label: macOS (.app)
            bundles: app
            artifact: aquarius-writer-macos-app
            artifact-path: src-tauri/target/release/bundle/macos/*.zip

    steps:
      # A note on `@v4`: the os-image repo pins every action to a full commit
      # SHA, because Renovate keeps those pins fresh there. This repo has no
      # Renovate yet, and SHA pins nobody updates rot into a security theatre.
      # Major-version tags it is — revisit if Renovate is ever added here.
      - name: Check out the repo
        uses: actions/checkout@v4

      # ---- Tag sanity check (only on a version tag) -------------------------
      # The repo declares its version in three files that have to agree, and the
      # tag you push is a fourth. Tagging `v0.2.0` while package.json still says
      # 0.1.0 would publish a release full of files named 0.1.0 — confusing, and
      # a nuisance to unpick once it is public.
      #
      # So: check it here, before anything slow happens, and fail in thirty
      # seconds instead of twenty minutes. If this fails, fix the version in the
      # three files, commit, delete the tag, and tag again.
      - name: Check the tag matches the version in the repo
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          # ${GITHUB_REF_NAME} is "v0.1.0"; strip the v to get "0.1.0".
          tag_version="${GITHUB_REF_NAME#v}"

          # node is on every runner, so this reads the JSON properly rather than
          # grepping it and hoping.
          pkg_version="$(node -p "require('./package.json').version")"
          tauri_version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          cargo_version="$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d'"' -f2)"

          echo "tag:              ${tag_version}"
          echo "package.json:     ${pkg_version}"
          echo "tauri.conf.json:  ${tauri_version}"
          echo "Cargo.toml:       ${cargo_version}"

          for declared in "${pkg_version}" "${tauri_version}" "${cargo_version}"; do
            if [ "${declared}" != "${tag_version}" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match every declared version. See the four numbers above."
              exit 1
            fi
          done

      # ---- Linux system libraries -------------------------------------------
      # Tauri v2's Linux prerequisites, from the official setup page
      # (https://v2.tauri.app/start/prerequisites/), plus `patchelf`, which the
      # AppImage bundler uses to rewrite the binary's library paths.
      #
      # The one that matters most is libwebkit2gtk-4.1-dev: WebKitGTK IS the
      # browser engine the app renders in on Linux. Note "4.1" — Tauri v1 used
      # 4.0, and pointing at the wrong one is the classic Tauri-on-Linux build
      # failure.
      - name: Install the Linux build libraries
        if: matrix.os == 'ubuntu-22.04'
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file \
            patchelf

      # ---- Toolchains -------------------------------------------------------
      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      # Rust builds are slow from scratch and almost instant when cached. This
      # caches ~/.cargo and src-tauri/target, keyed on the platform and the
      # lockfile, so only real dependency changes pay full price.
      - name: Cache the Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # `npm ci` installs exactly what package-lock.json says — no surprise
      # version bumps in a build. It needs the lockfile to be in step with
      # package.json and will fail loudly if it is not.
      #
      # Install scripts are left ON, because esbuild (which Vite builds with)
      # uses one. This repo's own `postinstall` runs too and immediately does
      # nothing: it is iCloud housekeeping for Royce's Mac and exits early when
      # it sees `CI`.
      - name: Install the npm packages
        run: npm ci

      # ---- Checks -----------------------------------------------------------
      # Run before the slow part, so a broken backend fails in two minutes
      # rather than twenty.
      - name: Run the Rust tests
        working-directory: src-tauri
        run: cargo test

      # ---- The actual build --------------------------------------------------
      # `tauri build` runs `npm run build` first (that is `beforeBuildCommand`
      # in tauri.conf.json), compiles the Rust shell in release mode, then
      # packages the result.
      #
      # `--bundles` narrows tauri.conf.json's target list to the one format this
      # job wants: the Linux job would otherwise also build a .deb, and the Mac
      # job a .dmg, doubling the time for artifacts nobody is testing yet.
      - name: Build the app
        run: npm run tauri:build -- --bundles ${{ matrix.bundles }}

      # ---- Hand-off ---------------------------------------------------------
      # A .app is a folder, and upload-artifact would silently flatten it and
      # lose the executable bit. Zipping it first keeps it a working app.
      - name: Zip the Mac app
        if: matrix.os == 'macos-14'
        working-directory: src-tauri/target/release/bundle/macos
        run: ditto -c -k --sequesterRsrc --keepParent "Aquarius Writer.app" "Aquarius Writer.app.zip"

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
          retention-days: 14

      # TODO (distribution, needs Royce's decisions and secrets):
      #   * macOS: signing + notarisation. Needs an Apple Developer ID
      #     certificate and an app-specific password, stored as repository
      #     secrets, then APPLE_CERTIFICATE / APPLE_SIGNING_IDENTITY /
      #     APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID on the build step.
      #     Unsigned, the .app shows Gatekeeper's "damaged / unidentified
      #     developer" warning on any Mac but Royce's own.
      #   * Note transparency is currently inactive on macOS because
      #     `app.macOSPrivateApi` is off — enabling it bars the app from the Mac
      #     App Store, so it stays off until Royce decides. See docs/NOTES.md §6.
      #   * Linux: the AppImage is unsigned. Signing is optional there and
      #     usually a detached GPG signature published alongside the file.
      #   * Updater: `bundle.createUpdaterArtifacts` plus a TAURI_SIGNING_
      #     PRIVATE_KEY secret, and a place to host the update manifest. Until
      #     that exists, a new version means downloading a new release by hand.

  # ============================================================================
  # Publish the release
  # ============================================================================
  # Plain English: the job above builds the app and leaves the files on the run's
  # page, where they expire after 14 days and only you can reach them. This job
  # takes those same files and puts them somewhere permanent and public — a
  # GitHub Release on the tag you pushed.
  #
  # It only ever runs for a tag starting with `v`. Ordinary pushes to `main`
  # skip it entirely, so nothing you do day to day can publish by accident.
  #
  # WHY THIS EXISTS: AquariusOS bakes Aquarius Writer into the OS image. The OS
  # build downloads the AppImage from a release URL and checks it against
  # SHA256SUMS.txt before trusting it. That needs two things this job
  # guarantees — a *predictable filename* and a *checksum file* — which is why
  # the files get renamed here rather than being published as tauri named them.
  release:
    name: Publish the release
    needs: build
    # `needs: build` waits for BOTH matrix legs. If the Mac build fails, no
    # release is published at all — a release missing half its files is worse
    # than no release.
    if: startsWith(github.ref, 'refs/tags/v')
    # Nothing is compiled here, only downloaded and renamed, so this job has no
    # glibc concerns and can just use whatever Ubuntu is current.
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The build job only needs to read the repo. This one has to write a
    # release, so it asks for that permission here rather than widening the
    # whole workflow.
    permissions:
      contents: write

    steps:
      # Needed for CHANGELOG.md, which becomes the release description.
      - name: Check out the repo
        uses: actions/checkout@v4

      # No `name:` means "download every artifact this run produced". Each one
      # lands in its own subfolder named after the artifact.
      - name: Fetch the files the build job made
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # ---- Rename ------------------------------------------------------------
      # tauri names the AppImage after the product, spaces and all:
      # "Aquarius Writer_0.1.0_amd64.AppImage". That is a nuisance for anything
      # scripted — every command that touches it has to quote it — and the OS
      # image build is scripted. So published files get one flat convention,
      # the same one Aquarius Editor uses:
      #
      #   AquariusWriter-<version>-x86_64.AppImage   (Linux, the AquariusOS one)
      #   AquariusWriter-<version>-arm64.zip         (macOS, Apple Silicon)
      #
      # Renaming an AppImage is safe: it is one self-contained file and nothing
      # inside it depends on what it is called.
      - name: Give the files their published names
        run: |
          set -euo pipefail
          # An unmatched glob should vanish rather than be passed through as a
          # literal string — that turns "the bundler renamed something" into a
          # clean failure below instead of a file-not-found later.
          shopt -s nullglob

          version="${GITHUB_REF_NAME#v}"
          mkdir -p release-files

          appimage=(artifacts/aquarius-writer-linux-appimage/*.AppImage)
          mac_zip=(artifacts/aquarius-writer-macos-app/*.zip)

          if [ "${#appimage[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one .AppImage, found ${#appimage[@]}."
            exit 1
          fi
          if [ "${#mac_zip[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one Mac .zip, found ${#mac_zip[@]}."
            exit 1
          fi

          mv "${appimage[0]}" "release-files/AquariusWriter-${version}-x86_64.AppImage"
          mv "${mac_zip[0]}"  "release-files/AquariusWriter-${version}-arm64.zip"

          # An AppImage has to be executable to run. Uploading and downloading
          # strips that bit anyway — GitHub does not carry file permissions
          # through a release asset — so whoever downloads it still has to run
          # `chmod +x`. Setting it here costs nothing and keeps the file correct
          # for as long as it is on the runner.
          chmod +x release-files/*.AppImage

          ls -l release-files

      # ---- Checksums ---------------------------------------------------------
      # SHA256SUMS.txt is how a download is proved to be the file this build
      # made and not something that got corrupted or swapped on the way.
      # AquariusOS's image build checks the AppImage against this before baking
      # it in, so this file is not decoration — the OS build fails without it.
      #
      # The `./*` glob expands BEFORE the redirect creates SHA256SUMS.txt, which
      # is why the file does not list itself. Anyone can verify a download by
      # putting it next to this file and running `sha256sum -c SHA256SUMS.txt`.
      - name: Write SHA256SUMS.txt
        working-directory: release-files
        run: |
          set -euo pipefail
          sha256sum ./* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # ---- The description ---------------------------------------------------
      # The release description is not written here — it is lifted out of
      # CHANGELOG.md, from the section whose heading starts "## v0.1.0 ". Keeping
      # it in the repo means the notes are reviewed in the same pull request as
      # the code, and the release cannot quietly disagree with the changelog.
      #
      # No section for this tag is a hard failure. Publishing a release with an
      # empty description is not something to discover afterwards.
      - name: Take the release notes out of CHANGELOG.md
        run: |
          set -euo pipefail

          # Match the heading by its exact prefix INCLUDING the trailing space,
          # so that tagging v0.1.0 cannot accidentally match a "## v0.1.01"
          # heading. Print everything after it until the next "## " heading.
          awk -v want="## ${GITHUB_REF_NAME} " '
            index($0, want) == 1 { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no '## ${GITHUB_REF_NAME} ' section. Add one and tag again."
            exit 1
          fi

          # Then a short standard footer, the same on every release: which file
          # a person actually wants, and how to check it downloaded intact.
          version="${GITHUB_REF_NAME#v}"
          cat >> release-notes.md <<EOF

          ---

          ### Which file do I want?

          | You are on | Download |
          |---|---|
          | **AquariusOS, or any Linux PC/handheld** | \`AquariusWriter-${version}-x86_64.AppImage\` |
          | **A Mac with Apple Silicon** | \`AquariusWriter-${version}-arm64.zip\` |

          The AppImage is the whole app in one file — there is nothing to install:

          \`\`\`bash
          chmod +x AquariusWriter-${version}-x86_64.AppImage
          ./AquariusWriter-${version}-x86_64.AppImage
          \`\`\`

          ### Checking your download

          Put \`SHA256SUMS.txt\` in the same folder as the file you downloaded, then:

          \`\`\`bash
          sha256sum -c SHA256SUMS.txt
          \`\`\`

          \`OK\` means the file is exactly what this build produced. Anything else
          means download it again.
          EOF

          echo "----- release description -----"
          cat release-notes.md

      # ---- Publish -----------------------------------------------------------
      # Done with the `gh` command line tool, which is preinstalled on every
      # runner, rather than a third-party action — one less thing to keep pinned.
      #
      # The order matters. The release is created as a DRAFT, the files are
      # uploaded into it, and only then is it made public. A draft is invisible
      # to everyone but you, so nobody can ever catch this release half-uploaded
      # and download a file that is not there yet. What ends up published is a
      # complete, public, non-draft release.
      - name: Publish it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Re-running a tag that already published would otherwise replace the
          # files under a release people may already be using. Refuse instead.
          # To genuinely redo one: delete the release on GitHub, then re-run.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "::error::Release ${GITHUB_REF_NAME} already exists. Delete it on GitHub first, or tag a new version."
            exit 1
          fi

          # --verify-tag refuses to invent a tag that does not exist. It does
          # here, since this run was started by pushing it.
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --verify-tag \
            --draft

          gh release upload "${GITHUB_REF_NAME}" release-files/* --clobber

          gh release edit "${GITHUB_REF_NAME}" --draft=false

          echo "Published: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"
